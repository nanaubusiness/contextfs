name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package source
        run: |
          mkdir /tmp/contextfs-pkg
          tar \
              --exclude='.git' \
              --exclude='node_modules' \
              --exclude='dist' \
              --exclude='.github' \
              --exclude='*.summary' \
              --exclude='context-map.json' \
              --exclude='contextfs' \
              --exclude='contextfs-*.tar.gz' \
              -czf /tmp/contextfs-pkg/contextfs.tar.gz .
          mv /tmp/contextfs-pkg/contextfs.tar.gz .

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: contextfs.tar.gz
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
